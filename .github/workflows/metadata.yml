name: Update metadata & README

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install jq
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq

      - name: Build metadata + README
        run: |
          chmod +x scripts/cli.sh
          bash scripts/cli.sh build

      - name: Commit to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --rebase origin main
          bash scripts/cli.sh build
          if ! git diff --quiet HEAD -- metadata.json README.md; then
            git add metadata.json README.md
            git commit -m "chore(metadata): update collections info [skip ci]"
            git push origin main
          else
            echo "metadata/README unchanged, skipping push"
          fi
